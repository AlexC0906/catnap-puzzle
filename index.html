<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Catnap — a cat logic puzzle</title>
<meta name="description" content="A cozy logic puzzle with cats: one cat in every row, column and colored cushion. Daily puzzle, 60-level journey and endless free play.">
<meta name="theme-color" content="#fbe3cf" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#1c1320" media="(prefers-color-scheme: dark)">
<meta property="og:title" content="Catnap — a cat logic puzzle">
<meta property="og:description" content="One cat in every row, column and colored cushion. No two cats may touch.">
<meta property="og:type" content="website">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body class="skin-ginger">
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <radialGradient id="galaxyFur" cx="35%" cy="30%" r="80%">
      <stop offset="0" stop-color="#6d5bd0"/><stop offset=".55" stop-color="#2b2a6e"/><stop offset="1" stop-color="#151538"/>
    </radialGradient>
    <symbol id="cat" viewBox="0 0 100 100">
      <path d="M16 46 L14 10 L40 28 Q50 25 60 28 L86 10 L84 46 Q90 60 84 74 Q72 92 50 92 Q28 92 16 74 Q10 60 16 46Z" style="fill:var(--cat)"/>
      <path d="M14 12 L40 28 Q44 27 46 27 L42 52 Q26 56 14 48Z" style="fill:var(--cat-p1,none)"/>
      <path d="M86 12 L62 28 L66 44 Q80 46 85 40Z" style="fill:var(--cat-p2,none)"/>
      <ellipse cx="50" cy="64" rx="30" ry="24" style="fill:var(--cat-mask,none)"/>
      <path d="M20 18 L36 30 L22 40Z M80 18 L64 30 L78 40Z" style="fill:var(--cat-ear)"/>
      <path d="M38 34 Q44 40 50 34 Q56 40 62 34" style="stroke:var(--cat-stripe,none)" stroke-width="4" fill="none" stroke-linecap="round"/>
      <path d="M30 80 Q50 98 70 80 Q60 88 50 88 Q40 88 30 80Z" style="fill:var(--cat-bib,none)"/>
      <ellipse cx="50" cy="72" rx="20" ry="13" style="fill:var(--cat-muzzle)"/>
      <path d="M30 56 Q36 51 42 56 M58 56 Q64 51 70 56" style="stroke:var(--cat-face)" stroke-width="4.5" fill="none" stroke-linecap="round"/>
      <path d="M46 66 L54 66 L50 71Z" style="fill:var(--cat-nose)"/>
      <path d="M50 71 Q50 77 44 77 M50 71 Q50 77 56 77" style="stroke:var(--cat-mouth,var(--cat-face))" stroke-width="3" fill="none" stroke-linecap="round"/>
      <path d="M30 68 L6 63 M30 73 L6 76 M70 68 L94 63 M70 73 L94 76" style="stroke:var(--cat-whisker,var(--cat-face))" stroke-width="2.4" stroke-linecap="round" opacity=".75"/>
      <g style="fill:var(--cat-sparkle,none)"><circle cx="28" cy="38" r="2"/><circle cx="70" cy="30" r="1.6"/><circle cx="76" cy="62" r="1.4"/><circle cx="24" cy="66" r="1.2"/></g>
    </symbol>
    <symbol id="ex" viewBox="0 0 100 100">
      <path d="M30 30 L70 70 M70 30 L30 70" stroke="currentColor" stroke-width="11" stroke-linecap="round"/>
    </symbol>
    <symbol id="i-help" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9.5" fill="none" stroke="currentColor" stroke-width="2.2"/><path d="M9.3 9.3a2.8 2.8 0 1 1 3.9 2.6c-.8.4-1.2 1-1.2 1.8v.5" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/><circle cx="12" cy="17.2" r="1.3" fill="currentColor"/></symbol>
    <symbol id="i-stats" viewBox="0 0 24 24"><path d="M5 20V12M12 20V5M19 20v-9" stroke="currentColor" stroke-width="3" stroke-linecap="round"/></symbol>
    <symbol id="i-gear" viewBox="0 0 24 24"><path d="M12 8.5a3.5 3.5 0 1 0 0 7 3.5 3.5 0 0 0 0-7Z" fill="none" stroke="currentColor" stroke-width="2.2"/><path d="M12 2.5v3M12 18.5v3M2.5 12h3M18.5 12h3M5.3 5.3l2.1 2.1M16.6 16.6l2.1 2.1M5.3 18.7l2.1-2.1M16.6 7.4l2.1-2.1" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></symbol>
    <symbol id="i-star" viewBox="0 0 24 24"><path d="M12 2.8l2.8 5.8 6.3.9-4.6 4.4 1.1 6.3L12 17.2 6.4 20.2l1.1-6.3L2.9 9.5l6.3-.9Z" fill="currentColor"/></symbol>
    <symbol id="i-lock" viewBox="0 0 24 24"><rect x="5" y="10.5" width="14" height="10" rx="2.5" fill="currentColor"/><path d="M8 10.5V8a4 4 0 0 1 8 0v2.5" fill="none" stroke="currentColor" stroke-width="2.4"/></symbol>
    <symbol id="i-left" viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></symbol>
    <symbol id="i-right" viewBox="0 0 24 24"><path d="M9 5l7 7-7 7" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></symbol>
    <symbol id="i-flame" viewBox="0 0 24 24"><path d="M12 2.5c1 3.5 5.5 6 5.5 11a5.5 5.5 0 0 1-11 0c0-2.6 1.5-4.2 2.6-5.2.2 1.6 1 2.7 2 3.2-.6-3.4.2-6.4.9-9Z" fill="currentColor"/></symbol>
  </defs>
</svg>

<header class="top">
  <div class="brand">
    <svg class="logo" aria-hidden="true"><use href="#cat"/></svg>
    <div>
      <h1 data-i18n="title">Catnap</h1>
      <p class="tag" data-i18n="tagline">One cat in every row, column and colored cushion. And no two cats may touch.</p>
    </div>
  </div>
  <div class="icons">
    <button class="icon" id="btnHelp" type="button" data-i18n-label="help" data-i18n-title="help"><svg><use href="#i-help"/></svg></button>
    <button class="icon" id="btnStats" type="button" data-i18n-label="stats" data-i18n-title="stats"><svg><use href="#i-stats"/></svg></button>
    <button class="icon" id="btnSettings" type="button" data-i18n-label="settings" data-i18n-title="settings"><svg><use href="#i-gear"/></svg></button>
    <button class="lang" id="lang" type="button">RO</button>
  </div>
</header>

<nav class="tabs" role="tablist" data-i18n-label="modesLabel">
  <button role="tab" id="tabDaily" data-mode="daily" type="button" data-i18n="modeDaily">Daily</button>
  <button role="tab" id="tabJourney" data-mode="journey" type="button" data-i18n="modeJourney">Journey</button>
  <button role="tab" id="tabFree" data-mode="free" type="button" data-i18n="modeFree">Free play</button>
</nav>

<div class="modebar" id="modebar"></div>

<main class="play">
  <section class="boardWrap" data-i18n-label="boardLabel">
    <div class="boardFrame" id="frame">
      <div id="board" class="board" role="grid"></div>
      <div id="loading" class="overlay loading" hidden>
        <svg class="sleepy" aria-hidden="true"><use href="#cat"/></svg>
        <p data-i18n="generating">Cats are picking their cushions…</p>
      </div>
      <div id="pauseOv" class="overlay pauseOv" hidden>
        <button type="button" id="resumeBtn" class="pauseCard">
          <svg class="sleepy" aria-hidden="true"><use href="#cat"/></svg>
          <span data-i18n="paused">Paused.</span>
          <b data-i18n="resume">Resume</b>
        </button>
      </div>
      <div id="win" class="overlay win" hidden>
        <div class="winCard" role="dialog" aria-labelledby="winTitle">
          <svg class="winCat" aria-hidden="true"><use href="#cat"/></svg>
          <h2 id="winTitle" data-i18n="winTitle">Meow! Solved.</h2>
          <div id="winStars" class="winStars"></div>
          <p id="winText"></p>
          <p id="winExtra" class="winExtra"></p>
          <div class="winBtns">
            <button id="share" type="button" data-i18n="share">Copy result</button>
            <button id="winNext" type="button" class="primary">Next</button>
          </div>
          <p id="shareMsg" class="small" aria-live="polite"></p>
        </div>
      </div>
    </div>
    <p class="howto small" data-i18n-html="howto"></p>
  </section>

  <aside class="side">
    <div class="pname"><span id="puzzleName"></span><span id="tierBadge" class="badge"></span></div>
    <div class="stats">
      <div><span class="label" data-i18n="time">Time</span><span id="timer" class="big">0:00</span></div>
      <div><span class="label" data-i18n="cats">Cats</span><span id="catCount" class="big">0/8</span></div>
    </div>
    <div class="controls">
      <button id="undo" type="button" data-i18n="undo">Undo</button>
      <button id="hint" type="button" class="hintBtn" data-i18n="hint">Hint</button>
      <button id="pause" type="button" data-i18n="pause">Pause</button>
      <button id="reset" type="button" data-i18n="reset">Restart</button>
    </div>
    <div id="hintBox" class="hintBox" hidden aria-live="polite">
      <p id="hintText"></p>
      <div class="hintBtns">
        <button id="hintApply" type="button" class="primary" data-i18n="apply">Apply</button>
        <button id="hintClose" type="button" data-i18n="close">Close</button>
      </div>
    </div>
    <details class="rules">
      <summary data-i18n="rules">Rules</summary>
      <ol>
        <li data-i18n="rule1"></li><li data-i18n="rule2"></li><li data-i18n="rule3"></li><li data-i18n="rule4"></li>
      </ol>
      <p class="small" data-i18n="rulesNote"></p>
    </details>
  </aside>
</main>

<footer class="foot small"><span data-i18n="footer"></span> · <a href="https://github.com/AlexC0906/catnap-puzzle">GitHub</a></footer>

<!-- dialogs -->
<dialog id="dlgHelp" class="dlg">
  <div class="dlgHead"><h2 data-i18n="help">How to play</h2><button type="button" class="dlgX" data-close aria-label="Close">×</button></div>
  <ol class="ruleList">
    <li data-i18n="rule1"></li><li data-i18n="rule2"></li><li data-i18n="rule3"></li><li data-i18n="rule4"></li>
  </ol>
  <p class="small" data-i18n="helpExample"></p>
  <div id="helpBoard" class="miniBoard"></div>
  <h3 data-i18n="helpControls">Controls</h3>
  <ul><li data-i18n="helpC1"></li><li data-i18n="helpC2"></li><li data-i18n="helpC3"></li><li data-i18n="helpC4"></li></ul>
  <h3 data-i18n="helpTips">Tips</h3>
  <ul><li data-i18n="helpT1"></li><li data-i18n="helpT2"></li><li data-i18n="helpT3"></li></ul>
  <button type="button" class="primary wide" data-close data-i18n="gotIt">Got it</button>
</dialog>

<dialog id="dlgStats" class="dlg">
  <div class="dlgHead"><h2 data-i18n="stats">Statistics</h2><button type="button" class="dlgX" data-close aria-label="Close">×</button></div>
  <div id="statsBody"></div>
</dialog>

<dialog id="dlgSettings" class="dlg">
  <div class="dlgHead"><h2 data-i18n="settings">Settings</h2><button type="button" class="dlgX" data-close aria-label="Close">×</button></div>
  <div class="setRow"><span data-i18n="language">Language</span>
    <div class="seg" id="langSeg"><button type="button" data-lang="ro">Română</button><button type="button" data-lang="en">English</button></div>
  </div>
  <label class="toggle"><input type="checkbox" id="optSound"> <span data-i18n="sound">Sounds</span></label>
  <label class="toggle"><input type="checkbox" id="optAutoX"> <span data-i18n="autoX">Auto ×</span></label>
  <label class="toggle"><input type="checkbox" id="optErr"> <span data-i18n="showErr">Show mistakes</span></label>
  <label class="toggle"><input type="checkbox" id="optCb"> <span data-i18n="colorblind">Labels</span></label>
  <label class="toggle"><input type="checkbox" id="optCoach"> <span data-i18n="coach">Coach</span></label>
  <h3 data-i18n="catSkin">Your cat</h3>
  <div id="skins" class="skins"></div>
  <p class="small" data-i18n="skinHint"></p>
  <button type="button" id="resetAll" class="danger" data-i18n="resetProgress">Erase all progress</button>
  <p id="resetMsg" class="small" aria-live="polite"></p>
</dialog>

<dialog id="dlgLevels" class="dlg wideDlg">
  <div class="dlgHead"><h2 data-i18n="levels">All levels</h2><button type="button" class="dlgX" data-close aria-label="Close">×</button></div>
  <div id="levelGrid" class="levelGrid"></div>
</dialog>

<script src="src/i18n.js"></script>
<script src="src/engine.js"></script>
<script src="src/logic.js"></script>
<script src="src/levels.js"></script>
<script src="src/audio.js"></script>
<script src="src/game.js"></script>
</body>
</html>
